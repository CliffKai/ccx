name: Fetch 2026 A-share requested data

on:
  workflow_dispatch:
  push:
    paths:
      - 'market_data_job/fetch_2026_a_share.py'
      - '.github/workflows/fetch-2026-a-share.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch and validate complete data
        run: python market_data_job/fetch_2026_a_share.py
      - name: Commit generated raw data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market_data_job/output
          git commit -m 'Add complete 2026 A-share daily data [skip ci]' || echo 'No changes to commit'
          git push

