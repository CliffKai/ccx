name: Cleanup temporary market data job

on:
  push:
    paths:
      - '.github/workflows/fetch-2026-a-share.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove temporary extraction files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -rf market_data_job
          git rm .github/workflows/fetch-2026-a-share.yml
          git commit -m 'Remove temporary A-share extraction job [skip ci]'
          git push origin HEAD:main
