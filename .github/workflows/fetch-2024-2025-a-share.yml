name: Fetch 2024-2025 A-share requested data

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch and validate complete data
        id: fetchdata
        continue-on-error: true
        shell: bash
        run: |
          rm -rf market_data_job/output_2024_2025
          mkdir -p market_data_job/output_2024_2025
          set -o pipefail
          python market_data_job/fetch_2024_2025_a_share.py 2>&1 | tee market_data_job/output_2024_2025/run.log
      - name: Upload raw files and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: market-data-2024-2025-output
          path: market_data_job/output_2024_2025
          if-no-files-found: error
          retention-days: 3
      - name: Commit generated raw data and diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A market_data_job/output_2024_2025
          git commit -m 'Add complete 2024-2025 A-share data output [skip ci]' || echo 'No changes to commit'
          git push origin HEAD:main
      - name: Mark fetch failure
        if: steps.fetchdata.outcome == 'failure'
        run: exit 1
