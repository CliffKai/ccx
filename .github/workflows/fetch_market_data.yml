name: Fetch market data
on:
  pull_request:
    paths:
      - scripts/fetch_market.py
      - .github/workflows/fetch_market_data.yml
permissions:
  contents: write
jobs:
  probe:
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        target: [BK1137, BK1326, BK1325]
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Probe one series
        env:
          TARGET: ${{ matrix.target }}
          SHARD: ${{ matrix.shard }}
        run: python scripts/fetch_market.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ matrix.target }}-${{ matrix.shard }}
          path: attempt_output
          retention-days: 1
  aggregate:
    if: always()
    needs: probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: attempts
      - name: Aggregate successful probes
        run: python scripts/fetch_market.py aggregate
      - name: Commit results
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add market_data_output
          git commit -m 'generated: complete missing market series' || exit 0
          git push origin HEAD:${{ github.head_ref }}
