name: Package market data
on:
  pull_request:
    paths:
      - .github/workflows/fetch_market_data.yml
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/upload-artifact@v4
        with:
          name: existing-market-data
          path: market_data_output/*.csv
          retention-days: 1
